spring:
  data:
    mongodb:
      uri: mongodb://admin:admin123@localhost:27017/shopnest?authSource=admin
      auto-index-creation: true
logging:
  level:
    com.shopnest: DEBUG
    org.springframework.data.mongodb.core.MongoTemplate: DEBUG
  file:
    name: logs/shopnes.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7