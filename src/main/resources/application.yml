spring:
  application:
    name: shopnest-api
  profiles:
    active: dev
  server:
    port: 8080
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 50

logging:
  pattern:
    correlation: "[%X{correlationId:-}] "

shopnest:
  catalog:
    allowed-categories:
      - electronics
      - books
      - fashion

